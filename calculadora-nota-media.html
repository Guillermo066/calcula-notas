<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de nota media</title>
    <meta name="description" content="Calcula fácilmente tu nota media introduciendo todas tus calificaciones.">

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
    <div class="contenedor">
        <h1>Calculadora de nota media</h1>
        <p>Calcula la media de todas tus notas en segundos.</p>
    </div>
</header>

<main class="contenedor">

    <div class="calculadora">

        <label>Nota 1</label>
        <input type="number" id="n1" min="0" max="10" step="0.01">

        <label>Nota 2</label>
        <input type="number" id="n2" min="0" max="10" step="0.01">

        <label>Nota 3</label>
        <input type="number" id="n3" min="0" max="10" step="0.01">

        <label>Nota 4</label>
        <input type="number" id="n4" min="0" max="10" step="0.01">

        <button onclick="calcularMedia()">
            Calcular media
        </button>

        <div id="resultado" class="resultado"></div>

    </div>

</main>

<script>
function calcularMedia() {
    const notas = [];

    ["n1", "n2", "n3", "n4"].forEach(function(id) {
        const campo = document.getElementById(id);
        const valor = Number(campo.value);

        if (!isNaN(valor)) {
            notas.push(valor);
        }
    });

    if (notas.length === 0) {
        document.getElementById("resultado").textContent =
            "Introduce al menos una nota.";
        return;
    }

    const suma = notas.reduce(function(total, nota) {
        return total + nota;
    }, 0);

    const media = suma / notas.length;

    document.getElementById("resultado").textContent =
        "Tu nota media es: " + media.toFixed(2);
}
</script>
</body>
</html>
