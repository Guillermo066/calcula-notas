<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de nota media</title>

    <meta
        name="description"
        content="Calcula fácilmente tu nota media introduciendo todas tus calificaciones."
    >

    <link rel="stylesheet" href="estilos.css">
</head>

<body>
<body>

<header class="barra-superior">
  <div class="barra-contenido">

    <a href="index.html" class="marca">
      <img src="logo.svg" alt="Logo de CalculaNotas">
      <span>CalculaNotas</span>
    </a>

    <nav class="menu-principal">
      <a href="index.html">Inicio</a>
      <a href="index.html#calculadoras">Calculadoras</a>
      <a href="index.html#ventajas">Ventajas</a>
      <a href="index.html#preguntas">Preguntas frecuentes</a>
    </nav>

    <a href="#calculadora" class="boton-empezar">
      Empezar
    </a>

  </div>
</header>


<main class="contenedor" id="calculadora">

    <div class="calculadora">

        <label for="n1">Nota 1</label>
        <input type="number" id="n1" min="0" max="10" step="0.01">

        <label for="n2">Nota 2</label>
        <input type="number" id="n2" min="0" max="10" step="0.01">

        <label for="n3">Nota 3</label>
        <input type="number" id="n3" min="0" max="10" step="0.01">

        <label for="n4">Nota 4</label>
        <input type="number" id="n4" min="0" max="10" step="0.01">

        <button type="button" id="botonMedia">
            Calcular media
        </button>

        <div id="resultadoMedia"></div>

    </div>

</main>

<script>
    const botonMedia = document.getElementById("botonMedia");

    botonMedia.addEventListener("click", function () {
        const ids = ["n1", "n2", "n3", "n4"];
        const notas = [];

        ids.forEach(function (id) {
            const campo = document.getElementById(id);

            if (campo.value !== "") {
                const nota = Number(campo.value);

                if (nota >= 0 && nota <= 10) {
                    notas.push(nota);
                }
            }
        });

        const resultado = document.getElementById("resultadoMedia");

        if (notas.length === 0) {
            resultado.textContent = "Introduce al menos una nota válida.";
            return;
        }

        const suma = notas.reduce(function (total, nota) {
            return total + nota;
        }, 0);

        const media = suma / notas.length;

        resultado.textContent =
            "Tu nota media es: " + media.toFixed(2);
    });
</script>
<footer class="pie-pagina">
  <div class="pie-contenido">

    <div class="pie-marca">
      <strong>CalculaNotas</strong>
      <p>Calculadoras gratuitas para estudiantes.</p>
    </div>

    <div class="pie-enlaces">
      <a href="index.html">Inicio</a>
      <a href="index.html#calculadoras">Calculadoras</a>
      <a href="#">Aviso legal</a>
      <a href="#">Política de privacidad</a>
    </div>

    <p class="pie-copyright">
      © 2026 CalculaNotas. Todos los derechos reservados.
    </p>

  </div>
</footer>
</body>
</html>
