<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de nota media</title>

    <meta
        name="description"
        content="Calcula fácilmente tu nota media introduciendo todas tus calificaciones."
    >

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

<header>
    <div class="contenedor">
        <nav class="menu">
    <a href="index.html">Calculadora nota necesaria</a>
    <a href="calculadora-nota-media.html">Calculadora nota media</a>
    <a href="calculadora-media-ponderada.html">Calculadora media ponderada</a>
</nav>
        <h1>Calculadora de nota media</h1>
        <p>Calcula la media de todas tus notas en segundos.</p>
    </div>
</header>

<main class="contenedor">

    <div class="calculadora">

        <label for="n1">Nota 1</label>
        <input type="number" id="n1" min="0" max="10" step="0.01">

        <label for="n2">Nota 2</label>
        <input type="number" id="n2" min="0" max="10" step="0.01">

        <label for="n3">Nota 3</label>
        <input type="number" id="n3" min="0" max="10" step="0.01">

        <label for="n4">Nota 4</label>
        <input type="number" id="n4" min="0" max="10" step="0.01">

        <button type="button" id="botonMedia">
            Calcular media
        </button>

        <div id="resultadoMedia"></div>

    </div>

</main>

<script>
    const botonMedia = document.getElementById("botonMedia");

    botonMedia.addEventListener("click", function () {
        const ids = ["n1", "n2", "n3", "n4"];
        const notas = [];

        ids.forEach(function (id) {
            const campo = document.getElementById(id);

            if (campo.value !== "") {
                const nota = Number(campo.value);

                if (nota >= 0 && nota <= 10) {
                    notas.push(nota);
                }
            }
        });

        const resultado = document.getElementById("resultadoMedia");

        if (notas.length === 0) {
            resultado.textContent = "Introduce al menos una nota válida.";
            return;
        }

        const suma = notas.reduce(function (total, nota) {
            return total + nota;
        }, 0);

        const media = suma / notas.length;

        resultado.textContent =
            "Tu nota media es: " + media.toFixed(2);
    });
</script>

</body>
</html>
