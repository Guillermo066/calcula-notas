<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de media ponderada</title>

    <link rel="stylesheet" href="estilos.css">
</head>
<body>

<header>
    <div class="contenedor">
        <nav class="menu">
    <a href="index.html">Calculadora nota necesaria</a>
    <a href="calculadora-nota-media.html">Calculadora nota media</a>
    <a href="calculadora-media-ponderada.html">Calculadora media ponderada</a>
</nav>
        <h1>Calculadora de media ponderada</h1>
        <p>Calcula tu nota teniendo en cuenta el porcentaje de cada examen.</p>
    </div>
</header>

<main class="contenedor">

    <div class="calculadora">

        <label>Nota 1</label>
        <input type="number" id="nota1" min="0" max="10">

        <label>Peso (%)</label>
        <input type="number" id="peso1" min="0" max="100">

        <label>Nota 2</label>
        <input type="number" id="nota2" min="0" max="10">

        <label>Peso (%)</label>
        <input type="number" id="peso2" min="0" max="100">

        <label>Nota 3</label>
        <input type="number" id="nota3" min="0" max="10">

        <label>Peso (%)</label>
        <input type="number" id="peso3" min="0" max="100">

        <button id="calcularPonderada">
            Calcular media ponderada
        </button>

        <div id="resultadoPonderada"></div>

    </div>

</main>

<script>
const boton=document.getElementById("calcularPonderada");

boton.addEventListener("click",function(){

const n1=Number(document.getElementById("nota1").value);
const n2=Number(document.getElementById("nota2").value);
const n3=Number(document.getElementById("nota3").value);

const p1=Number(document.getElementById("peso1").value);
const p2=Number(document.getElementById("peso2").value);
const p3=Number(document.getElementById("peso3").value);

const total=p1+p2+p3;

if(total!==100){
document.getElementById("resultadoPonderada").textContent="Los porcentajes deben sumar 100%.";
return;
}

const media=(n1*p1+n2*p2+n3*p3)/100;

document.getElementById("resultadoPonderada").textContent="Tu media ponderada es: "+media.toFixed(2);

});
</script>

</body>
</html>
