<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de media ponderada</title>

    <link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="barra-superior">
  <div class="barra-contenido">

    <a href="index.html" class="marca">
      <img src="logo.svg" alt="Logo de CalculaNotas">
      <span>CalculaNotas</span>
    </a>

    <nav class="menu-principal">
      <a href="index.html">Inicio</a>
      <a href="index.html#calculadoras">Calculadoras</a>
      <a href="index.html#ventajas">Ventajas</a>
      <a href="index.html#preguntas">Preguntas frecuentes</a>
    </nav>

    <a href="#calculadora" class="boton-empezar">
      Empezar
    </a>

  </div>
</header>

<main class="contenedor" id="calculadora"></main>

    <div class="calculadora">

        <label>Nota 1</label>
        <input type="number" id="nota1" min="0" max="10">

        <label>Peso (%)</label>
        <input type="number" id="peso1" min="0" max="100">

        <label>Nota 2</label>
        <input type="number" id="nota2" min="0" max="10">

        <label>Peso (%)</label>
        <input type="number" id="peso2" min="0" max="100">

        <label>Nota 3</label>
        <input type="number" id="nota3" min="0" max="10">

        <label>Peso (%)</label>
        <input type="number" id="peso3" min="0" max="100">

        <button id="calcularPonderada">
            Calcular media ponderada
        </button>

        <div id="resultadoPonderada"></div>

    </div>

</main>

<script>
const boton=document.getElementById("calcularPonderada");

boton.addEventListener("click",function(){

const n1=Number(document.getElementById("nota1").value);
const n2=Number(document.getElementById("nota2").value);
const n3=Number(document.getElementById("nota3").value);

const p1=Number(document.getElementById("peso1").value);
const p2=Number(document.getElementById("peso2").value);
const p3=Number(document.getElementById("peso3").value);

const total=p1+p2+p3;

if(total!==100){
document.getElementById("resultadoPonderada").textContent="Los porcentajes deben sumar 100%.";
return;
}

const media=(n1*p1+n2*p2+n3*p3)/100;

document.getElementById("resultadoPonderada").textContent="Tu media ponderada es: "+media.toFixed(2);

});
</script>
<footer class="pie-pagina">
  <div class="pie-contenido">

    <div class="pie-marca">
      <strong>CalculaNotas</strong>
      <p>Calculadoras gratuitas para estudiantes.</p>
    </div>

    <div class="pie-enlaces">
      <a href="index.html">Inicio</a>
      <a href="index.html#calculadoras">Calculadoras</a>
      <a href="#">Aviso legal</a>
      <a href="#">Política de privacidad</a>
    </div>

    <p class="pie-copyright">
      © 2026 CalculaNotas. Todos los derechos reservados.
    </p>

  </div>
</footer>
</body>
</html>
